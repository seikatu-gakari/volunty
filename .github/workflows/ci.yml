name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  frontend-quality-gates:
    name: Next.js チェック
    runs-on: ubuntu-latest
    steps:
      - name: ソースチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 依存関係インストール
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm ci

      - name: 依存関係インストール (fallback)
        if: ${{ hashFiles('package-lock.json') == '' && hashFiles('package.json') != '' }}
        run: npm install

      - name: TypeScript 型チェック
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run typecheck --if-present

      - name: ESLint
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run lint --if-present

      - name: Vitest
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run test --if-present -- --runInBand

      - name: Storybook テスト
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run test-storybook --if-present
