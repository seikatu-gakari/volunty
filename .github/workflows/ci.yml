name: Pull Request CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - labeled
      - unlabeled
      - ready_for_review

permissions:
  contents: read

env:
  TZ: Asia/Tokyo

concurrency:
  group: pull-request-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  demo-policy:
    name: demo-policy
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.evaluate.outputs.outcome }}
      required: ${{ steps.evaluate.outputs.required }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Evaluate PR demo contract
        id: evaluate
        continue-on-error: true
        env:
          PR_DEMO_DECISION_PATH: ${{ runner.temp }}/pr-demo/decision.json
        run: node .github/scripts/pr-demo/evaluate-pr.mjs

      - name: Upload PR demo decision
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pr-demo-decision
          path: ${{ runner.temp }}/pr-demo/decision.json
          if-no-files-found: warn
          retention-days: 3

      - name: Enforce PR demo contract
        if: ${{ always() }}
        env:
          EVALUATION_OUTCOME: ${{ steps.evaluate.outcome }}
        run: |
          if [ "$EVALUATION_OUTCOME" != "success" ]; then
            echo "PR demo contract is invalid." >&2
            exit 1
          fi

  quality:
    name: quality
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:1
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:1/postgres
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:1/postgres
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Run PR demo contract tests
        working-directory: .
        run: node --test .github/scripts/pr-demo/*.test.mjs

      - name: Run production build
        run: npm run build -- --webpack

  rls:
    name: rls
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          pg_config --bindir >> "$GITHUB_PATH"

      - name: Run migration-only RLS contract
        run: bash supabase/rls.test.sh

  e2e:
    name: e2e
    needs:
      - demo-policy
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Download PR demo decision
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pr-demo-decision
          path: ${{ runner.temp }}/pr-demo

      - name: Enforce demo policy result
        env:
          DEMO_POLICY_RESULT: ${{ needs.demo-policy.result }}
          PR_DEMO_DECISION_PATH: ${{ runner.temp }}/pr-demo/decision.json
        run: |
          if [ "$DEMO_POLICY_RESULT" != "success" ] || [ ! -f "$PR_DEMO_DECISION_PATH" ]; then
            echo "demo-policy did not produce a valid decision." >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Supabase CLI
        id: supabase_cli
        uses: supabase/setup-cli@v2

      - name: Install dependencies
        working-directory: app
        run: npm ci --no-audit

      - name: Install Playwright Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Start local Supabase
        run: supabase start

      - name: Export local Supabase status
        run: supabase status -o env > "$RUNNER_TEMP/supabase.env"

      - name: Prepare E2E environment
        run: bash .github/scripts/prepare-e2e-env.sh "$RUNNER_TEMP/supabase.env"

      - name: Reset local database and seed
        run: supabase db reset --local

      - name: Run Playwright E2E
        working-directory: app
        run: npm run test:e2e

      - name: Install video conversion tools
        if: ${{ needs.demo-policy.outputs.outcome == 'capture' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Reset database and record PR demo
        if: ${{ needs.demo-policy.outputs.outcome == 'capture' }}
        working-directory: app
        env:
          PR_DEMO_DECISION_PATH: ${{ runner.temp }}/pr-demo/decision.json
          PR_DEMO_ARTIFACT_DIR: ${{ runner.temp }}/pr-demo
          PR_DEMO_TEST_OUTPUT_ROOT: ${{ runner.temp }}/pr-demo-recordings
        run: node ../.github/scripts/pr-demo/run-capture.mjs

      - name: Upload Playwright artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            app/playwright-report
            app/test-results
          if-no-files-found: ignore

      - name: Upload PR demo result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pr-demo-results
          path: ${{ runner.temp }}/pr-demo
          if-no-files-found: warn
          retention-days: 3

      - name: Stop local Supabase
        if: ${{ always() && steps.supabase_cli.outcome == 'success' }}
        run: supabase stop --no-backup
