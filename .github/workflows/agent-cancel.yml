name: Agent Orchestrator - Cancel

on:
  issues:
    types: [labeled]

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: agent-orchestrator-${{ github.repository }}
  queue: max
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    environment: agent-orchestrator
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/agent-orchestrator/main.mjs cancel
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CURSOR_AGENT_ORCHESTRATOR_PAT: ${{ secrets.CURSOR_AGENT_ORCHESTRATOR_PAT }}
