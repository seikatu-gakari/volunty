name: Agent Review Signal

on:
  pull_request_review:
    types: [submitted]

permissions: {}

concurrency:
  group: agent-orchestrator-${{ github.repository }}-pull-request-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Capture GitHub-generated review event
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/agent-review-signal"
          cp "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/agent-review-signal/review-event.json"
      - name: Upload untrusted review signal
        uses: actions/upload-artifact@v4
        with:
          name: agent-review-signal
          path: ${{ runner.temp }}/agent-review-signal/review-event.json
          if-no-files-found: error
          retention-days: 1
