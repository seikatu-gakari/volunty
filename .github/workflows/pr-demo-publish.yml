name: Publish PR demo video

on:
  workflow_run:
    workflows:
      - Pull Request CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: Maintainerが公開を承認するPull Request CI run ID
        required: true
        type: string

permissions:
  actions: read
  contents: write
  id-token: write
  issues: write
  pages: write
  pull-requests: read
  statuses: write

concurrency:
  group: ${{ github.repository }}-pr-demo-pages
  cancel-in-progress: false

jobs:
  publish:
    name: demo-video
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout trusted main scripts
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          persist-credentials: false

      - name: Download untrusted PR demo artifact
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_repository.full_name == github.repository }}
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: pr-demo-results
          path: artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}

      - name: Checkout historyless Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate artifact and prepare Pages tree
        id: prepare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_DEMO_ARTIFACT_DIR: ${{ github.workspace }}/artifact
          PR_DEMO_SITE_DIR: ${{ github.workspace }}/site
          PR_DEMO_RESULT_PATH: ${{ runner.temp }}/pr-demo-publish/result.json
          PR_DEMO_PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          PR_DEMO_SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          PR_DEMO_MANUAL_FORK_APPROVAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: node source/.github/scripts/pr-demo/prepare-publish.mjs

      - name: Configure GitHub Pages
        if: ${{ steps.prepare.outputs.site_changed == 'true' }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: ${{ steps.prepare.outputs.site_changed == 'true' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deploy
        if: ${{ steps.prepare.outputs.site_changed == 'true' }}
        uses: actions/deploy-pages@v4

      - name: Replace gh-pages with one historyless commit
        id: persist
        if: ${{ steps.prepare.outputs.site_changed == 'true' }}
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Pages tree is already current."
            exit 0
          fi
          expected_sha="$(git rev-parse HEAD)"
          tree_sha="$(git write-tree)"
          commit_sha="$(printf 'Update PR demo for %s\n' '${{ steps.prepare.outputs.head_sha }}' | git commit-tree "$tree_sha")"
          git push origin "$commit_sha:refs/heads/gh-pages" "--force-with-lease=refs/heads/gh-pages:$expected_sha"

      - name: Confirm latest HEAD on Pages
        id: pages
        if: ${{ steps.prepare.outputs.outcome == 'published' }}
        env:
          PR_DEMO_MANIFEST_URL: ${{ steps.prepare.outputs.manifest_url }}
          PR_DEMO_HEAD_SHA: ${{ steps.prepare.outputs.head_sha }}
        run: node source/.github/scripts/pr-demo/wait-for-pages.mjs

      - name: Upsert PR comment and set demo-video status
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_DEMO_RESULT_PATH: ${{ runner.temp }}/pr-demo-publish/result.json
          PR_DEMO_SITE_READY: ${{ steps.prepare.outputs.site_changed != 'true' || (steps.deploy.outcome == 'success' && steps.persist.outcome == 'success') }}
          PR_DEMO_PAGES_READY: ${{ steps.pages.outcome == 'success' }}
        run: node source/.github/scripts/pr-demo/finalize-publish.mjs
