name: Publish PR demo video

on:
  workflow_run:
    workflows:
      - Pull Request CI
    types:
      - requested
      - in_progress
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: Maintainerが公開を承認するPull Request CI run ID
        required: true
        type: string
      run_attempt:
        description: Maintainerが内容を確認したPull Request CI run attempt
        required: true
        type: string
      pr_number:
        description: 対象Pull Request番号（API障害時のfail-closed用）
        required: true
        type: string
      head_sha:
        description: 確認した40文字のPull Request HEAD SHA（API障害時のfail-closed用）
        required: true
        type: string

permissions: {}

jobs:
  invalidate:
    name: Invalidate stale demo-video status
    if: ${{ github.event_name == 'workflow_run' && (github.event.action == 'requested' || github.event.action == 'in_progress') && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
      pull-requests: read
      statuses: write
    steps:
      - name: Checkout trusted main scripts
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Acquire PR demo operation lock
        id: pages_lock
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/pr-demo/pages-lock.mjs acquire

      - name: Mark demo-video pending for the current CI run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/pr-demo/invalidate-status.mjs

      - name: Release PR demo operation lock
        if: ${{ always() && steps.pages_lock.outputs.lock_ref_id != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_DEMO_PAGES_LOCK_REF_ID: ${{ steps.pages_lock.outputs.lock_ref_id }}
          PR_DEMO_PAGES_LOCK_SHA: ${{ steps.pages_lock.outputs.lock_sha }}
        run: node .github/scripts/pr-demo/pages-lock.mjs release

  publish:
    name: Prepare PR demo Pages
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.action == 'completed' && github.event.workflow_run.event == 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      head_sha: ${{ steps.prepare.outputs.head_sha || github.event.workflow_run.head_sha || inputs.head_sha }}
      finalizer_artifact_name: ${{ steps.handoff.outputs.artifact_name }}
      pages_ready: ${{ steps.handoff.outputs.pages_ready }}
      site_ready: ${{ steps.handoff.outputs.site_ready }}
    permissions:
      actions: read
      contents: write
      id-token: write
      issues: write
      pages: write
      pull-requests: read
      statuses: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout trusted main scripts
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download and safely extract untrusted PR demo artifact
        id: artifact
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_repository.full_name == github.repository }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_DEMO_SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          PR_DEMO_SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.run_attempt }}
          PR_DEMO_ARCHIVE_PATH: ${{ runner.temp }}/pr-demo-download/pr-demo-results.zip
          PR_DEMO_ARTIFACT_DIR: ${{ github.workspace }}/artifact
        run: node source/.github/scripts/pr-demo/download-artifact.mjs

      - name: Acquire GitHub Pages publish lock
        id: pages_lock
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node source/.github/scripts/pr-demo/pages-lock.mjs acquire

      - name: Checkout historyless Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 1

      - name: Install trusted media validation tools
        if: ${{ steps.artifact.outcome == 'success' && steps.artifact.outputs.has_media == 'true' }}
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Validate artifact and prepare Pages tree
        id: prepare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_DEMO_ARTIFACT_DIR: ${{ github.workspace }}/artifact
          PR_DEMO_SITE_DIR: ${{ github.workspace }}/site
          PR_DEMO_RESULT_PATH: ${{ runner.temp }}/pr-demo-publish/result.json
          PR_DEMO_PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          PR_DEMO_SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          PR_DEMO_SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.run_attempt }}
          PR_DEMO_MANUAL_FORK_APPROVAL: ${{ github.event_name == 'workflow_dispatch' }}
          PR_DEMO_MANUAL_PR_NUMBER: ${{ inputs.pr_number }}
          PR_DEMO_MANUAL_HEAD_SHA: ${{ inputs.head_sha }}
        run: node source/.github/scripts/pr-demo/prepare-publish.mjs

      - name: Configure GitHub Pages
        if: ${{ steps.prepare.outputs.site_changed == 'true' }}
        uses: actions/configure-pages@v5

      - name: Prepare public Pages artifact
        if: ${{ steps.prepare.outputs.site_changed == 'true' }}
        env:
          PR_DEMO_SITE_DIR: ${{ github.workspace }}/site
          PR_DEMO_PUBLIC_SITE_DIR: ${{ runner.temp }}/pr-demo-pages-site
        run: node source/.github/scripts/pr-demo/prepare-pages-artifact.mjs

      - name: Upload Pages artifact
        if: ${{ steps.prepare.outputs.site_changed == 'true' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pr-demo-pages-site

      - name: Deploy GitHub Pages
        id: deploy
        if: ${{ steps.prepare.outputs.site_changed == 'true' }}
        uses: actions/deploy-pages@v4

      - name: Replace gh-pages with one historyless commit
        id: persist
        if: ${{ steps.prepare.outputs.site_changed == 'true' }}
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Pages tree is already current."
            exit 0
          fi
          expected_sha="$(git rev-parse HEAD)"
          tree_sha="$(git write-tree)"
          commit_sha="$(printf 'Update PR demo for %s\n' '${{ steps.prepare.outputs.head_sha }}' | git commit-tree "$tree_sha")"
          git push origin "$commit_sha:refs/heads/gh-pages" "--force-with-lease=refs/heads/gh-pages:$expected_sha"

      - name: Confirm latest HEAD on Pages
        id: pages
        if: ${{ steps.prepare.outputs.outcome == 'published' }}
        env:
          PR_DEMO_MANIFEST_URL: ${{ steps.prepare.outputs.manifest_url }}
          PR_DEMO_HEAD_SHA: ${{ steps.prepare.outputs.head_sha }}
          PR_DEMO_MANIFEST_SHA256: ${{ steps.prepare.outputs.manifest_sha256 }}
        run: node source/.github/scripts/pr-demo/wait-for-pages.mjs

      - name: Release GitHub Pages publish lock
        if: ${{ always() && steps.pages_lock.outputs.lock_ref_id != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_DEMO_PAGES_LOCK_REF_ID: ${{ steps.pages_lock.outputs.lock_ref_id }}
          PR_DEMO_PAGES_LOCK_SHA: ${{ steps.pages_lock.outputs.lock_sha }}
        run: node source/.github/scripts/pr-demo/pages-lock.mjs release

      - name: Prepare trusted finalizer handoff
        id: handoff
        if: ${{ always() && steps.prepare.outputs.head_sha != '' }}
        env:
          PR_DEMO_RESULT_PATH: ${{ runner.temp }}/pr-demo-publish/result.json
          PR_DEMO_SITE_READY: ${{ steps.prepare.outputs.site_changed != 'true' || (steps.deploy.outcome == 'success' && steps.persist.outcome == 'success') }}
          PR_DEMO_PAGES_READY: ${{ steps.pages.outcome == 'success' }}
        run: |
          test -f "$PR_DEMO_RESULT_PATH"
          mkdir -p "$RUNNER_TEMP/pr-demo-finalizer"
          cp -- "$PR_DEMO_RESULT_PATH" "$RUNNER_TEMP/pr-demo-finalizer/result.json"
          {
            echo "artifact_name=pr-demo-finalizer-${GITHUB_RUN_ATTEMPT}"
            echo "site_ready=$PR_DEMO_SITE_READY"
            echo "pages_ready=$PR_DEMO_PAGES_READY"
          } >> "$GITHUB_OUTPUT"

      - name: Upload trusted finalizer handoff
        if: ${{ always() && steps.handoff.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.handoff.outputs.artifact_name }}
          path: ${{ runner.temp }}/pr-demo-finalizer/result.json
          if-no-files-found: error
          retention-days: 1

  finalize:
    name: Finalize demo-video status
    needs: publish
    if: ${{ always() && needs.publish.outputs.head_sha != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: read
      statuses: write
    steps:
      - name: Checkout trusted main scripts
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download trusted finalizer handoff
        id: handoff
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.publish.outputs.finalizer_artifact_name }}
          path: ${{ runner.temp }}/pr-demo-finalizer

      - name: Acquire PR demo operation lock
        id: pages_lock
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node source/.github/scripts/pr-demo/pages-lock.mjs acquire

      - name: Upsert PR comment and set demo-video status
        if: ${{ always() && steps.pages_lock.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_DEMO_RESULT_PATH: ${{ runner.temp }}/pr-demo-finalizer/result.json
          PR_DEMO_SITE_READY: ${{ needs.publish.outputs.site_ready }}
          PR_DEMO_PAGES_READY: ${{ needs.publish.outputs.pages_ready }}
          PR_DEMO_SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          PR_DEMO_SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.run_attempt }}
          PR_DEMO_MANUAL_FORK_APPROVAL: ${{ github.event_name == 'workflow_dispatch' }}
          PR_DEMO_MANUAL_PR_NUMBER: ${{ inputs.pr_number }}
          PR_DEMO_MANUAL_HEAD_SHA: ${{ inputs.head_sha }}
        run: node source/.github/scripts/pr-demo/finalize-publish.mjs

      - name: Release PR demo operation lock
        if: ${{ always() && steps.pages_lock.outputs.lock_ref_id != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_DEMO_PAGES_LOCK_REF_ID: ${{ steps.pages_lock.outputs.lock_ref_id }}
          PR_DEMO_PAGES_LOCK_SHA: ${{ steps.pages_lock.outputs.lock_sha }}
        run: node source/.github/scripts/pr-demo/pages-lock.mjs release
